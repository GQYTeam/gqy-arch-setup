# GQYOS Hyprlock Configuration

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

input-field {
    monitor =
    size = 300, 45
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = #cba6f7
    inner_color = #1e1e2e
    font_color = #cdd6f4
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">密码...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = #cdd6f4
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%Y年%m月%d日 %A")"
    color = #a6adc8
    font_size = 18
    font_family = Noto Sans CJK SC
    position = 0, -40
    halign = center
    valign = center
}

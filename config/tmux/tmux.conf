# GQYOS Tmux Configuration

# 前缀键改为 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 支持 256 色和 TrueColor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 鼠标支持
set -g mouse on

# 窗口/面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 更长的历史记录
set -g history-limit 50000

# 更快的按键响应
set -sg escape-time 0

# 状态栏
set -g status-position bottom
set -g status-style "bg=#313244 fg=#cdd6f4"
set -g status-left "#[fg=#cba6f7,bold] #S "
set -g status-right "#[fg=#a6adc8] %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "

# 面板边框
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# 快捷键
bind r source-file ~/.tmux.conf \; display "配置已重载"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim 风格的面板切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 面板大小调整
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

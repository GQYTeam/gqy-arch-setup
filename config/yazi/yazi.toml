# GQYOS Yazi Configuration
# 为顾清影而造

[manager]
show_hidden = true
sort_by = natural
sort_dir_first = true
linemode = "size"
ratio = [1, 3, 4]

[preview]
max_width = 600
max_height = 900

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "nvim" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
  { name = "*.png", use = ["open"] },
  { name = "*.jpg", use = ["open"] },
  { name = "*.jpeg", use = ["open"] },
  { name = "*.gif", use = ["open"] },
  { name = "*.svg", use = ["open"] },
  { name = "*.pdf", use = ["open"] },
]

[keymap]
prepend_keymap = [
  { on = ["<C-n>"], run = "create", desc = "Create file/directory" },
  { on = ["<C-d>"], run = "remove --force", desc = "Remove" },
  { on = ["<C-r>"], run = "rename --bulk", desc = "Rename" },
  { on = ["<C-y>"], run = "yank", desc = "Yank" },
  { on = ["<C-p>"], run = "paste", desc = "Paste" },
  { on = ["q"], run = "close", desc = "Close" },
]

# GQY 服务端一键部署（Docker Compose）
#
# 整个 AI（顾清影）跑在此容器内，暴露 WebUI + HTTP/WebSocket；
# iOS/iPad/macOS/Windows/Linux/Android 的瘦客户端（浏览器 / PWA /
# 桌面或移动 WebView 壳）都指向本服务的地址即可对话。
#
# 启动：GQY_WEB_PASSWORD=你的密码 docker compose up -d
# 之后任意设备浏览器打开 http://<主机IP>:8300 即可使用。
services:
  gqy:
    image: ${GQY_IMAGE:-gqy:latest}
    build:
      context: .
    container_name: gqy
    restart: unless-stopped
    ports:
      - "${GQY_WEB_PORT:-8300}:8300"
    environment:
      # 建议必设：内网/公网暴露时保护 WebUI 登录
      GQY_WEB_PASSWORD: "${GQY_WEB_PASSWORD:-}"
      GQY_WEB_PORT: "8300"
      GQY_LANG: "${GQY_LANG:-auto}"
      # AI 核心（会话、记忆、日志、模型配置）全部落在此目录，需持久化
      GQY_HOME: /data
    volumes:
      - gqy-data:/data
    # 容器内禁用 IPC 上的本地 daemon 双进程；__daemon 前台模式即单进程
    # （如需 daemon 内部 fork 的 IPC/平台特性可去掉下面两行）
    ipc: private

volumes:
  gqy-data:
